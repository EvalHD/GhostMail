name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir -p entpackt
          unzip -q -o "$ZIP" -d entpackt
          SETTINGS=$(find entpackt -name settings.gradle.kts | head -n 1)
          echo "PROJ=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bauen
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MailApp-APK
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
